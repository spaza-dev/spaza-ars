[server]
bind = "127.0.0.1:8080"
public_base_url = "https://airplay-ars.spaza.co.ke"
api_token = "change-me"
health_public = true

[olaf]
rest_url = "http://127.0.0.1:8920"
db_path = "/var/lib/ars"
store_concurrency = 1
query_concurrency = 4
timeout_seconds = 120

[capture]
ffmpeg = "ffmpeg"
yt_dlp = "yt-dlp"
temp_dir = "/var/lib/ars/work"
max_streams = 50
chunk_seconds = 10
overlap_seconds = 2
restart_backoff_seconds = 5

[query]
min_confidence = 0.5
min_match_count = 20
aggregation_window_seconds = 60
dedupe_window_seconds = 30

[evidence]
enabled = true
endpoint = "https://fbcd54084e4deedee804e7222c65d5e3.r2.cloudflarestorage.com"
region = "auto"
bucket = "broadcast-index-archive"
access_key = "0a571ab38ab7f3359555c6da990657580d7d27b50207e1d96392ad134f08c1d2"
secret_key = "7d4743fa6be4ff9226b456812ac1c7dc"
prefix = "evidence"
path_style = true
pre_seconds = 10
post_seconds = 20
content_type = "audio/mpeg"

[webhook]
timeout_seconds = 15
max_attempts = 10
signing_secret = ""
