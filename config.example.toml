[server]
bind = "127.0.0.1:8080"
public_base_url = "https://airplay-ars.spaza.co.ke"
api_token = "change-me"
health_public = true

[olaf]
rest_url = "http://127.0.0.1:8920"
db_path = "/var/lib/ars"
store_concurrency = 1
query_concurrency = 4
timeout_seconds = 120

[capture]
ffmpeg = "ffmpeg"
yt_dlp = "yt-dlp"
temp_dir = "/var/lib/ars/work"
max_streams = 50
chunk_seconds = 10
overlap_seconds = 2
restart_backoff_seconds = 5

[query]
min_confidence = 0.5
min_match_count = 20
aggregation_window_seconds = 60
dedupe_window_seconds = 30

[evidence]
enabled = true
endpoint = "https://fbcd54084e4deedee804e7222c65d5e3.r2.cloudflarestorage.com"
region = "auto"
bucket = "evidence"
# config.toml values take precedence over ARS_EVIDENCE_S3_* env vars.
secret_key = "b68a7215ef7985a4990d9d84af360338ed0640883ca28fb3c302d5f4689faa57"
access_key = "bf29a16d54b62c72b40b340e10f5993c"
prefix = "evidence"
path_style = true
pre_seconds = 10
post_seconds = 20
content_type = "audio/mpeg"

[webhook]
timeout_seconds = 15
max_attempts = 10
signing_secret = ""

[index]
download_timeout_seconds = 120
max_download_bytes = 104857600
max_upload_bytes = 104857600
# Catalog reads reuse the [evidence] S3 credentials above.
catalog_bucket = "airplay-audd-catalog"
# Optional key allowlist; leave unset to accept any key in the catalog bucket.
# catalog_prefix = "catalog/"
